.lgw{min-height:80vh;display:grid;place-items:center}.lgc{width:100%;max-width:400px;padding:30px}.lgc h1{text-align:center;margin-bottom:4px}.lgc>p{text-align:center;margin:0 0 20px}

const nwB=u=>btoa(String.fromCharCode(...u)),nwUb=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0)),nwTe=new TextEncoder();
